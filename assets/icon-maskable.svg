<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The maskable variant. Two differences from icon.svg, both required:

    The background is full-bleed with no rounded corners, because the OS crops
    this to whatever shape it wants and any corner radius of ours would show as
    a notch inside theirs.

    The content is scaled to 84% so it sits well inside the safe circle - radius
    205 on a 512 canvas. At full size the leftmost dot's edge lands exactly on
    that boundary, which is close enough to get clipped on a round mask.
  -->
  <rect width="512" height="512" fill="#17161a"/>

  <g transform="translate(256 256) scale(0.84) translate(-256 -256)">
    <g stroke="#6f6a78" stroke-width="5" stroke-linecap="round">
      <line x1="91" y1="91" x2="91" y2="421"/>
      <line x1="201" y1="91" x2="201" y2="421"/>
      <line x1="311" y1="91" x2="311" y2="421"/>
      <line x1="421" y1="91" x2="421" y2="421"/>

      <line x1="91" y1="173.5" x2="421" y2="173.5"/>
      <line x1="91" y1="256" x2="421" y2="256"/>
      <line x1="91" y1="338.5" x2="421" y2="338.5"/>
      <line x1="91" y1="421" x2="421" y2="421"/>
    </g>

    <line x1="91" y1="91" x2="421" y2="91" stroke="#efeaf4" stroke-width="16" stroke-linecap="round"/>

    <circle cx="201" cy="132" r="35" fill="#62a2e0"/>
    <circle cx="311" cy="215" r="35" fill="#b088d8"/>
    <circle cx="91" cy="297" r="35" fill="#e8695a"/>
  </g>
</svg>
