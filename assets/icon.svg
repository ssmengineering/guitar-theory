<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    A chord box with three dots, in the app's own degree colours: root, third
    and seventh — the three tones that decide what a chord is.

    Content sits inside a centred 330px square, which keeps it clear of the
    circle an Android maskable icon gets cropped to.
  -->
  <rect width="512" height="512" rx="108" fill="#17161a"/>

  <g stroke="#6f6a78" stroke-width="5" stroke-linecap="round">
    <line x1="91" y1="91" x2="91" y2="421"/>
    <line x1="201" y1="91" x2="201" y2="421"/>
    <line x1="311" y1="91" x2="311" y2="421"/>
    <line x1="421" y1="91" x2="421" y2="421"/>

    <line x1="91" y1="173.5" x2="421" y2="173.5"/>
    <line x1="91" y1="256" x2="421" y2="256"/>
    <line x1="91" y1="338.5" x2="421" y2="338.5"/>
    <line x1="91" y1="421" x2="421" y2="421"/>
  </g>

  <!-- The nut. -->
  <line x1="91" y1="91" x2="421" y2="91" stroke="#efeaf4" stroke-width="16" stroke-linecap="round"/>

  <circle cx="201" cy="132" r="35" fill="#62a2e0"/>
  <circle cx="311" cy="215" r="35" fill="#b088d8"/>
  <circle cx="91" cy="297" r="35" fill="#e8695a"/>
</svg>
